url: https://wdfw-fp.github.io/creelreview/
template:
  bootstrap: 5
  includes:
    before_title: '<img src="https://wdfw.widen.net/content/rodpw2fbqj/png/wdfw_logo_stacked_fullcolor.png?w=300" alt="Logo" height="50" style="padding-right: 20px;">'
development:
  mode: auto

reference:
- title: "Creel Data Asesssment"
  desc: >
    The primary methods of performing QAQC
  contents:
    - run_all_checks
    - assess_datasets
    - format_assessment_gt

- title: "QAQC Report Generation"
  desc: >
    Render standardized HTML review reports.
  contents:
    - generate_report

- title: "Angler Interview Checks"
  desc: >
    Record-level checks on interview data. Each returns `list(result, detail)`.
  contents:
    - starts_with("interview_")

- title: "Effort Checks"
  desc: >
    Record-level checks on effort data. Each returns `list(result, detail)`.
  contents:
    - starts_with("effort_")

- title: "Example data"
  desc: >
    Bundled example dataset for testing and demonstration.
  contents:
    - example_dataset
